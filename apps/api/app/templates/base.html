<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Business Brain Ops{% endblock %}</title>
    <style>
      :root { --bg:#0b1220; --card:#121a2b; --ink:#e8eefc; --muted:#93a0b8; --line:#243049; --accent:#2a67f6; --good:#27c093; --bad:#f45b69; }
      * { box-sizing: border-box; }
      body { margin:0; font-family: ui-sans-serif, system-ui, sans-serif; background:var(--bg); color:var(--ink); }
      a { color:#9cbcff; text-decoration:none; }
      header { display:flex; gap:24px; align-items:center; padding:16px 28px; border-bottom:1px solid var(--line); }
      header nav { display:flex; gap:16px; }
      main { padding:28px; }
      .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
      .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
      .muted { color:var(--muted); font-size:13px; }
      table { width:100%; border-collapse:collapse; font-size:13px; }
      th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
      .pill { display:inline-block; padding:2px 8px; border-radius:999px; background:#1c2740; font-size:12px; }
    </style>
  </head>
  <body>
    <header>
      <strong>Business Brain / Ops</strong>
      <nav>
        <a href="/ops">Overview</a>
        <a href="/ops/events">Events</a>
        <a href="/ops/actions">Actions</a>
        <a href="/ops/agents">Agents</a>
        <a href="/docs">API</a>
      </nav>
      <span class="muted">{{ principal.merchant_id }}</span>
    </header>
    <main>{% block body %}{% endblock %}</main>
  </body>
</html>
